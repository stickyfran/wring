name: Sync Upstream & Trigger Build

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://git.opengrind.org/".insteadOf "ssh://git@git.opengrind.org/"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/VityaSchel/open-grind.git || git remote set-url upstream https://github.com/VityaSchel/open-grind.git
          git fetch upstream main

      - name: Check for new commits and merge
        id: sync_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_COMMITS=$(git log HEAD..upstream/main --oneline | wc -l)
          echo "Found $UPSTREAM_COMMITS new upstream commits."
          if [ "$UPSTREAM_COMMITS" -gt 0 ]; then
            echo "Merging upstream/main..."
            git merge --no-edit -m "chore(sync): sync upstream changes" upstream/main
            git submodule update --init --recursive
            git push origin main
            echo "Triggering build-apk.yml..."
            gh workflow run build-apk.yml --ref main || true
            echo "synced=true" >> $GITHUB_OUTPUT
          else
            echo "Already up to date."
            echo "synced=false" >> $GITHUB_OUTPUT
          fi
