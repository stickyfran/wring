name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Configure Git for public submodules over HTTPS
        run: |
          git config --global url."https://git.opengrind.org/".insteadOf "ssh://git@git.opengrind.org/"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker compose build

      - name: Compile Android APK
        run: |
          docker compose run --rm build

      - name: Locate Unsigned APK
        id: find_apk
        run: |
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Sign APK (Debug Certificate for Testing)
        id: sign_apk
        run: |
          sudo apt-get update && sudo apt-get install -y apksigner
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore not found, generating a new one"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          UNSIGNED_APK="${{ steps.find_apk.outputs.apk_path }}"
          SIGNED_APK="open-grind-signed-debug.apk"
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out "$SIGNED_APK" "$UNSIGNED_APK"
          echo "signed_apk=$SIGNED_APK" >> $GITHUB_OUTPUT

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-grind-android-signed-debug
          path: ${{ steps.sign_apk.outputs.signed_apk }}
          retention-days: 7

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d')-b${{ github.run_number }}"
          RELEASE_TITLE="Release $TAG_NAME"
          gh release create "$TAG_NAME" "${{ steps.sign_apk.outputs.signed_apk }}" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            --latest
